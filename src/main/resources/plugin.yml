name: Useful-Autocrafters
version: "${project.version}"
main: com.usefulautocrafters.UsefulAutocrafters
api-version: "1.21"
author: Cobbleworks
description: Preserves crafter ingredients during crafting and hopper automation
website: https://github.com/Cobbleworks/Useful-Autocrafter-Plugin

commands:
  usefulcrafter:
    description: Toggle the Useful-Autocrafters functionality on or off
    usage: /usefulcrafter <on|off>
    permission: usefulautocrafters.toggle
    aliases: [uac, ucraft]

permissions:
  usefulautocrafters.toggle:
    description: Allows toggling the Useful-Autocrafters functionality
    default: op
